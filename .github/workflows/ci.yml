name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Build app bundle
        if: runner.os == 'macOS'
        env:
          FASTYT_APP_DIR: ${{ runner.temp }}
        run: |
          ./scripts/install-macos.sh
          test -x "$FASTYT_APP_DIR/fast.yt.app/Contents/MacOS/fastyt"
          plutil -lint "$FASTYT_APP_DIR/fast.yt.app/Contents/Info.plist"
