[package]
name = "fastyt"
version = "0.2.0"
edition = "2024"
description = "A fast, ad-free YouTube music player for the desktop"
license = "MIT"
repository = "https://github.com/ChrisJamesHassell/fastyt"
readme = "README.md"
publish = false

[dependencies]
eframe = { version = "0.35.0", default-features = false, features = ["glow", "default_fonts"] }
egui_extras = { version = "0.35.0", features = ["image"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = { version = "3.4.2", features = ["platform-verifier"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
